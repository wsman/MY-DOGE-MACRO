# CI/CD Pipeline for MY-DOGE-MACRO
# 自动测试和部署工作流

name: MY-DOGE-MACRO CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  # ===========================================
  # Job 1: Backend Tests (Python/FastAPI)
  # ===========================================
  backend-test:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: 🔍 Run linter
        run: |
          pip install ruff
          ruff check .
      
      - name: 🧪 Run tests
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./server/coverage.xml

  # ===========================================
  # Job 2: Frontend Tests (React/Tauri)
  # ===========================================
  frontend-test:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: npm ci
      
      - name: 🔍 Run linter
        run: npm run lint || true
      
      - name: 🧪 Run tests
        run: npm test -- --coverage --passWithNoTests

  # ===========================================
  # Job 3: Engine Tests (Python/Quant)
  # ===========================================
  engine-test:
    name: 📈 Engine Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./engine
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pandas numpy
      
      - name: 🧪 Run tests
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing
      
      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./engine/coverage.xml

  # ===========================================
  # Job 4: CDD Constitutional Guardrails
  # ===========================================
  cdd-guardrails:
    name: 🏛️ CDD Guardrails
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: /home/wsman/桌面/Coding Task/MY-DOGE-MACRO
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          path: ./project
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: 📦 Install CDD tools
        run: |
          pip install pytest pyyaml
      
      - name: 🛡️ Gate 1: Version Consistency
        run: |
          cd /home/wsman/桌面/openclaw/skills/cdd
          python scripts/verify_versions.py --verbose || exit 1
      
      - name: ⚖️ Gate 2: Behavior Verification
        run: |
          cd /home/wsman/桌面/openclaw/skills/cdd
          pytest --verbose || exit 1
      
      - name: 📉 Gate 3: Entropy Check
        run: |
          cd /home/wsman/桌面/openclaw/skills/cdd
          python scripts/measure_entropy.py || exit 1

  # ===========================================
  # Job 5: Build and Docker (Optional)
  # ===========================================
  build:
    name: 📦 Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, engine-test, cdd-guardrails]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🔨 Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: my-doge-macro:latest
          load: true
      
      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: docker-image.tar

  # ===========================================
  # Job 6: Deploy to Staging (Optional)
  # ===========================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.my-doge-macro.example.com
    
    steps:
      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      - name: 🐳 Load image
        run: docker load < docker-image.tar
      
      - name: 🚀 Deploy
        run: |
          echo "Deploying to staging environment..."
          # Add actual deployment commands here
          # docker run -d -p 8080:8080 my-doge-macro:latest

  # ===========================================
  # Job 7: CDD Audit Report
  # ===========================================
  cdd-report:
    name: 📋 CDD Audit Report
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, engine-test, cdd-guardrails]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📊 Generate report
        run: |
          echo "# CDD Audit Report" > audit-report.md
          echo "**Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> audit-report.md
          echo "**Branch**: ${{ github.ref_name }}" >> audit-report.md
          echo "**Commit**: ${{ github.sha }}" >> audit-report.md
          echo "" >> audit-report.md
          echo "## Test Results" >> audit-report.md
          echo "- Backend: Passed" >> audit-report.md
          echo "- Frontend: Passed" >> audit-report.md
          echo "- Engine: Passed" >> audit-report.md
          echo "- CDD Guardrails: Passed" >> audit-report.md
      
      - name: 📤 Upload report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.md

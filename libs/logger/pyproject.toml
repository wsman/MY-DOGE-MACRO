[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-logger"
version = "1.0.0"
description = "Unified Logging Library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-adapters"
version = "1.0.0"
description = "Unified AI Model Adapters Library - Supporting 10+ LLM providers and 6+ Embedding models"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Auto-Pen & MY-DOGE-MACRO Team" }
]
keywords = ["ai", "llm", "embedding", "openai", "deepseek", "gemini", "ollama"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-community>=0.3.0",
]
chromadb = [
    "chromadb>=0.4.0",
]
all = [
    "ai-adapters[langchain,chromadb]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/shared-libs/ai-adapters"
Documentation = "https://github.com/shared-libs/ai-adapters#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_adapters"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websocket-hub"
version = "1.0.0"
description = "Unified WebSocket Hub for real-time communication - Supporting progress updates, notifications, and data streaming"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Auto-Pen & MY-DOGE-MACRO Team" }
]
keywords = ["websocket", "realtime", "fastapi", "progress", "notifications"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.100.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/shared-libs/websocket-hub"

[tool.hatch.build.targets.wheel]
packages = ["src/websocket_hub"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
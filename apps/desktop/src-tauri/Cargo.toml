[package]
name = "my-doge-tauri"
version = "1.0.0"
description = "MY-DOGE Quant System - Tauri Frontend"
authors = ["wsman"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.70"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.5.5", features = [] }

[dependencies]
tauri = { version = "2.10.2", features = [] }
tauri-plugin-shell = "2.3.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
rand = "0.8"
once_cell = "1.19"
portpicker = "0.1"
tauri-plugin-notification = "2.0.0-beta.0"

[features]
# this feature is used for production builds
default = ["custom-protocol"]
# use the `devPath` on development and the `distDir` on production
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "s"
debug = false
lto = true
codegen-units = 1
panic = "abort"
